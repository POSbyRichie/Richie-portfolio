    <!-- Prevent flash of incorrect theme -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("richie-theme");
          var root = document.documentElement;
          if (stored === "dark") {
            root.classList.add("dark");
          } else if (stored === "light") {
            root.classList.remove("dark");
          } else {
            // Default to bright, airy light theme per katiyardesign.md specification
            root.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
